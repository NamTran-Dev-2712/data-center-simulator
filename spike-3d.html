<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="google" content="notranslate" />
    <title>Spike 3D look</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #e6eaf2; }
      body[data-theme='dark'] { background: #0f1420; }
      #view { display: block; width: 100vw; height: 100vh; touch-action: none; }
      #hud {
        position: fixed; left: 10px; bottom: 10px; padding: 6px 10px;
        font: bold 16px/1.4 monospace; color: #eef1f7; background: rgba(15, 20, 32, 0.8);
        border-radius: 6px; pointer-events: none; white-space: pre;
      }
      #theme {
        position: fixed; right: 10px; bottom: 10px; padding: 8px 14px;
        font: bold 15px sans-serif; color: #eef1f7; background: rgba(15, 20, 32, 0.8);
        border: 0; border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">FPS -- · min(5s) --
Draw calls --</div>
    <button id="theme" type="button">Dark</button>
    <script type="module" src="/src/spike3d/main.ts"></script>
  </body>
</html>
